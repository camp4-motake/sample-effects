<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pyre</title>
<meta name="description" content="A seamless, photoreal wall of fire rendered in a single GLSL fragment shader.">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Questrial&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #000000;
    --ash: #f6ede4;
    --display: "Questrial", "Century Gothic", "Avenir Next", system-ui, sans-serif;
    --sans: "Instrument Sans", "Helvetica Neue", Arial, system-ui, sans-serif;
    --pad: clamp(16px, 4vw, 48px);
  }
  /* 黒背景はデザインの一部なので、ライト / ダーク設定で色を切り替えない */

  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--black);
    color: var(--ash);
    font-family: var(--sans);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* 炎のキャンバス。内部解像度は JS 側で落としており、CSS で全画面に引き伸ばす */
  #fire {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    transition: opacity 1.8s ease;
  }
  .ready #fire { opacity: 1; }

  /* WebGL が使えない場合の CSS フォールバック：下から立ち上る熱の光 */
  .no-webgl body {
    background:
      radial-gradient(120% 55% at 50% 108%, #ffd27a 0%, #ff7a1a 22%, #8c1d05 48%, transparent 72%),
      radial-gradient(60% 40% at 20% 105%, rgba(255, 140, 40, .55), transparent 70%),
      radial-gradient(60% 40% at 80% 105%, rgba(255, 120, 30, .5), transparent 70%),
      var(--black);
  }
  .no-webgl #fire { display: none; }

  .stage {
    position: relative;
    min-height: 100svh;
    display: grid;
    grid-template-rows: 1fr auto;
    padding: var(--pad);
  }

  /* タイトルは炎の届かない右上の暗部に小さく置く */
  .title {
    align-self: start;
    justify-self: end;
    /* letter-spacing の末尾分だけ右に余白ができるので打ち消し、右端をパディングにそろえる */
    margin: 0 -0.32em 0 0;
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(18px, 1.9vw, 28px);
    line-height: 1;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    text-shadow:
      0 0 0.35em rgba(255, 120, 30, .35),
      0 0 1.2em rgba(255, 80, 10, .25);
    animation: rise 2.4s cubic-bezier(.2, .7, .2, 1) .3s both,
               glow 5s ease-in-out 2.7s infinite;
  }

  .copyright {
    justify-self: center;
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    opacity: .85;
    /* 明るい炎の根元に重なるので、濃い影で読みやすさを確保する */
    text-shadow: 0 0 6px rgba(40, 8, 0, .9), 0 0 16px rgba(40, 8, 0, .7);
    animation: fade 1.6s ease 1.2s both;
  }

  /* lil-gui（右上はタイトルが使うので左上へ）。注入される lil-gui の CSS より優先させる */
  html .lil-gui.lil-auto-place {
    top: 0;
    right: auto;
    left: 15px;
    z-index: 10;
  }
  /* 狭い画面では左上だとタイトルと重なるので、タイトルの下に全幅で置く（下方向に開く） */
  @media (max-width: 600px) {
    html .lil-gui.lil-auto-place {
      top: 56px;
      left: 16px;
      right: 16px;
      --width: auto;
      max-height: calc(100svh - 112px);
    }
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(0.12em); filter: blur(10px); }
    to   { opacity: 1; transform: none; filter: blur(0); }
  }
  @keyframes fade { from { opacity: 0; } }
  /* 炎の明滅に合わせてタイトルの照り返しをゆっくり揺らす（0% / 100% は .title の text-shadow） */
  @keyframes glow {
    50% { text-shadow: 0 0 0.45em rgba(255, 140, 40, .5), 0 0 1.6em rgba(255, 90, 20, .35); }
  }

  @media (prefers-reduced-motion: reduce) {
    .title, .copyright { animation: none; }
    #fire { transition: none; }
  }
</style>
</head>
<body>
<canvas id="fire" aria-hidden="true"></canvas>
<main class="stage">
  <h1 class="title">Pyre</h1>
  <footer class="copyright"><small>© 2026 CAMP4 inc.</small></footer>
</main>

<script>
(() => {
  const root = document.documentElement;
  const canvas = document.getElementById('fire');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

  const gl = canvas.getContext('webgl', { antialias: false, alpha: false, depth: false, powerPreference: 'high-performance' });
  if (!gl) { root.classList.add('no-webgl'); return; }

  // GUI で調整できる値の既定値。シェーダの uniform と 1 対 1 で対応する
  const DEFAULTS = {
    // Motion
    loop: 18,          // ループ 1 周の秒数。シェーダ側は 0〜1 の位相だけを受け取る
    speed: 1.25,       // 時計の倍率（実際の 1 周は loop / speed = 14.4 秒）
    rise: 4,           // 1 ループで上へ流れる周期数（整数でないと継ぎ目が出る）
    evol: 2,           // 1 ループで形が変わる周期数（同上）
    freeze: false,
    phase: 0,
    // Shape
    height: 0.44,
    tongue: 0.82,
    gaps: 5.0,
    stretch: 4.9,
    warp: 0.5,
    // Look
    strands: 0.7,
    sharp: 0.3,
    intensity: 7.1,
    temp: 0.69,
    back: 1.0,
    haze: 1.2,
    vignette: 0.5,
    // Render
    quality: 0.25,     // 自動調整の下限 MIN_Q より低いが、自動調整は下げる方向にしか働かないのでそのまま保たれる
    autoQuality: true,
  };
  // ?phase=0〜1 で位相を固定する（スクリーンショットやループ継ぎ目の確認用）。GUI の Freeze と同じ
  const fixedPhase = parseFloat(new URLSearchParams(location.search).get('phase'));
  const urlOverrides = Number.isFinite(fixedPhase) ? { freeze: true, phase: fixedPhase } : {};
  const params = { ...DEFAULTS, ...urlOverrides };
  // シェーダに渡す値。uniform 名は 'u' + 先頭大文字のキー（rise → uRise）
  const UNIFORM_KEYS = [
    'rise', 'evol', 'height', 'tongue', 'gaps', 'stretch', 'warp',
    'strands', 'sharp', 'intensity', 'temp', 'back', 'haze', 'vignette',
  ];

  const vert = `
    attribute vec2 aPos;
    void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
  `;

  const frag = `
    precision highp float;
    uniform vec2  uRes;
    uniform float uPhase;   // 0〜1 のループ位相
    // GUI から調整する値。既定値と意味は JS 側の DEFAULTS を参照
    uniform float uRise, uEvol;          // 1 ループで上へ流れる / 形が変わる周期数（必ず整数）
    uniform float uHeight, uTongue;      // 炎の平均高さ、舌の高さのばらつき
    uniform float uGaps, uStretch, uWarp;
    uniform float uStrands, uSharp;
    uniform float uIntensity, uTemp;
    uniform float uBack, uHaze, uVignette;

    // y（上昇）と z（時間変化）の格子周期。位相 1 でちょうど整数周期ぶん進むので継ぎ目なくループする
    const float REP  = 4.0;
    const float TAU  = 6.28318530718;
    const vec3  REP3 = vec3(256.0, REP, REP);   // 1 オクターブ目の周期（x は実質非周期）

    float hash(vec3 p) {
      return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453123);
    }
    vec3 grad(vec3 i) {
      float a = hash(i) * TAU;
      float z = hash(i + 19.19) * 2.0 - 1.0;
      float r = sqrt(1.0 - z * z);
      return vec3(r * cos(a), r * sin(a), z);
    }
    // 周期 rep で繰り返す 3D グラディエントノイズ
    float pnoise(vec3 p, vec3 rep) {
      vec3 i = floor(p);
      vec3 f = p - i;
      vec3 u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
      vec3 i0 = mod(i, rep);
      vec3 i1 = mod(i + 1.0, rep);
      float n000 = dot(grad(i0),                         f);
      float n100 = dot(grad(vec3(i1.x, i0.y, i0.z)), f - vec3(1, 0, 0));
      float n010 = dot(grad(vec3(i0.x, i1.y, i0.z)), f - vec3(0, 1, 0));
      float n110 = dot(grad(vec3(i1.x, i1.y, i0.z)), f - vec3(1, 1, 0));
      float n001 = dot(grad(vec3(i0.x, i0.y, i1.z)), f - vec3(0, 0, 1));
      float n101 = dot(grad(vec3(i1.x, i0.y, i1.z)), f - vec3(1, 0, 1));
      float n011 = dot(grad(vec3(i0.x, i1.y, i1.z)), f - vec3(0, 1, 1));
      float n111 = dot(grad(i1),                         f - vec3(1, 1, 1));
      return mix(mix(mix(n000, n100, u.x), mix(n010, n110, u.x), u.y),
                 mix(mix(n001, n101, u.x), mix(n011, n111, u.x), u.y), u.z);
    }

    // オクターブごとに周波数と周期を 2 倍にするので、周期性は保たれる
    float fbm(vec3 p, int oct) {
      float s = 0.0, a = 0.5;
      vec3 rep = REP3;
      for (int i = 0; i < 6; i++) {
        if (i >= oct) break;
        s += a * pnoise(p, rep);
        p = p * 2.0 + vec3(17.3, 0.0, 0.0);
        rep *= 2.0;
        a *= 0.5;
      }
      return s;
    }
    // 尾根状ノイズ：炎の先端にある細い筋を作る
    float ridged(vec3 p) {
      float s = 0.0, a = 0.5;
      vec3 rep = REP3;
      for (int i = 0; i < 3; i++) {
        float n = 1.0 - abs(pnoise(p, rep));
        s += a * n * n;
        p = p * 2.0 + vec3(5.1, 0.0, 0.0);
        rep *= 2.0;
        a *= 0.5;
      }
      return s;
    }

    // 炎 1 層ぶん。w はドメインワープ、zo は層ごとの時間軸オフセット
    vec3 flame(float x, float y, vec2 w, float rise, float evol, float zo) {
      // 横に細かく縦に長いノイズで、縦方向に伸びた舌にする
      vec3 p = vec3(x * uStretch + w.x * 1.9 * uWarp, y * 1.8 - rise + w.y * 1.1 * uWarp, evol + zo);
      float n = fbm(p, 6);

      // 舌の高さを横方向にばらつかせる（ゆっくり変化）
      float tongue = fbm(vec3(x * 1.1, 0.0, evol * 0.5 + zo + 0.37), 3);
      float h = uHeight + tongue * uTongue;

      // 熱量：下ほど高く、上にいくほど減衰し、ノイズで削られて隙間ができる
      float heat = 0.85 - y / h + n * uGaps + w.y * 0.3 * uWarp;

      // 燃焼ガスの細い筋。炎の内部を明暗の束に分け、先端ではひげ状に伸ばす
      float r = ridged(p * vec3(2.2, 1.0, 1.0) + vec3(zo, 0.0, 0.0));
      float strands = r * r * uStrands;
      float edge = smoothstep(-0.45, 0.0, heat) * (1.0 - smoothstep(0.0, 0.35, heat));
      heat += edge * strands * 0.6;

      // 炎の内外をはっきり分ける（参考映像のように隙間は黒く抜ける）
      float body = smoothstep(0.0, uSharp, heat);
      // 輪郭の際まで橙に光るよう、炎の内側には最低限の熱を持たせる
      float T = (max(heat, 0.0) + 0.12) * (0.55 + 0.9 * strands);
      T = T * T * uIntensity + T * 0.5;

      // 黒体放射風のカラーランプ：暗赤 → 橙 → 黄 → 白
      // uTemp を上げると緑・青の成分が増え、黄〜白に寄る
      vec3 col = 1.0 - exp(-T * vec3(3.0, 1.1 * uTemp, 0.30 * uTemp * uTemp));
      col = pow(col, vec3(1.1, 1.45, 2.0));
      return col * body;
    }

    void main() {
      vec2 uv = gl_FragCoord.xy / uRes;
      float aspect = uRes.x / uRes.y;
      // 座標は高さ基準。縦長画面では炎が縦に伸びないよう座標を拡大するが、
      // 完全に幅基準にすると炎が低くなりすぎるので 0.6 乗で和らげる
      float k = pow(max(1.0 / aspect, 1.0), 0.6);
      float x = (uv.x - 0.5) * aspect * k + 40.0;   // +40 はノイズの見え方を選ぶシード（x は非周期）
      float y = uv.y * k;

      float ph = uPhase * REP;
      float rise = ph * uRise;
      float evol = ph * uEvol;

      // 低周波のドメインワープ：炎の舌をうねらせる
      // 上昇はゆっくり（1 ループで 1 周期）にして、大きなうねりが本体より遅れて昇るようにする
      vec3 q = vec3(x * 1.3, y * 0.9 - ph, evol);
      vec2 w = vec2(fbm(q, 3), fbm(q + vec3(31.7, 0.0, 0.0), 3));

      // 手前（明るく低い）と奥（暗く高い）の 2 層で奥行きを出す
      vec3 front = flame(x, y, w, rise, evol, 0.0);
      vec3 back  = flame(x + 11.0, y * 1.1, w.yx, rise, evol, 7.0);
      // 奥の層は赤く沈め、手前が明るいところでは隠れるように重ねる
      float cover = clamp(dot(front, vec3(0.6, 0.9, 0.3)) * 1.6, 0.0, 1.0);
      vec3 col = front + back * vec3(0.32, 0.11, 0.03) * uBack * (1.0 - cover);

      // 炎の上にうっすらかかる熱の照り返し
      float haze = exp(-y * 3.2) * (0.5 + 0.5 * fbm(vec3(x * 0.6, y * 0.4 - ph, evol * 0.5), 2));
      col += vec3(0.20, 0.05, 0.005) * haze * uHaze;

      // 周辺減光と、バンディングを抑える微小ディザ
      vec2 c = uv - 0.5;
      col *= 1.0 - dot(c, c) * uVignette;
      col += (hash(vec3(gl_FragCoord.xy, 0.0)) - 0.5) / 255.0;

      gl_FragColor = vec4(col, 1.0);
    }
  `;

  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      console.error(gl.getShaderInfoLog(s));
      return null;
    }
    return s;
  }
  function link(vs, fs) {
    if (!vs || !fs) return null;
    const p = gl.createProgram();
    gl.attachShader(p, vs);
    gl.attachShader(p, fs);
    gl.linkProgram(p);
    return gl.getProgramParameter(p, gl.LINK_STATUS) ? p : null;
  }
  const prog = link(compile(gl.VERTEX_SHADER, vert), compile(gl.FRAGMENT_SHADER, frag));
  if (!prog) { root.classList.add('no-webgl'); return; }
  gl.useProgram(prog);

  // 画面全体を覆う 1 枚の三角形
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  const uRes = gl.getUniformLocation(prog, 'uRes');
  const uPhase = gl.getUniformLocation(prog, 'uPhase');
  const uLocs = UNIFORM_KEYS.map((key) =>
    [gl.getUniformLocation(prog, 'u' + key[0].toUpperCase() + key.slice(1)), key]);

  // 内部解像度の倍率（params.quality）。炎は柔らかいので CSS ピクセルより粗くても破綻しない。
  // autoQuality のとき、描画が重い端末では frame() 内で段階的に下げる
  const MIN_Q = 0.4;

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.max(1, Math.round(window.innerWidth * dpr * params.quality));
    const h = Math.max(1, Math.round(window.innerHeight * dpr * params.quality));
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
      gl.viewport(0, 0, w, h);
      gl.uniform2f(uRes, w, h);
    }
  }
  window.addEventListener('resize', resize);
  resize();

  // prefers-reduced-motion では時計を遅くする（止めはしない）
  let motion = reduceMotion.matches ? 0.3 : 1.0;
  reduceMotion.addEventListener('change', (e) => { motion = e.matches ? 0.3 : 1.0; });

  // 時間の状態は params.phase（0〜1）だけで持つ
  let last;
  let slow = 0;
  let frames = 0;
  let lost = false;
  let fps = 0;

  function frame(now) {
    if (lost) return;
    const dt = Math.min((now - last) / 1000, 0.1);
    last = now;
    if (dt > 0) fps += (1 / dt - fps) * 0.05;
    if (!params.freeze) {
      params.phase = (params.phase + dt * params.speed * motion / params.loop) % 1;
    }

    // 重いフレームが続いたら内部解像度を下げる
    frames++;
    if (params.autoQuality && frames > 30) {
      if (dt > 1 / 40) slow++; else slow = Math.max(0, slow - 1);
      if (slow > 20 && params.quality > MIN_Q) {
        params.quality = Math.max(MIN_Q, Math.round((params.quality - 0.1) * 100) / 100);
        slow = 0;
        resize();
      }
    }

    gl.uniform1f(uPhase, params.phase);
    for (const [loc, key] of uLocs) gl.uniform1f(loc, params[key]);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    // 1 フレーム目は opacity: 0 のまま描かせ、2 フレーム目で .ready を付けてフェードインを発火させる
    if (frames === 2) root.classList.add('ready');
    requestAnimationFrame(frame);
  }

  // 非表示タブでは rAF 自体が止まるので、追加の一時停止処理は不要
  canvas.addEventListener('webglcontextlost', (e) => {
    e.preventDefault();
    lost = true;
    root.classList.add('no-webgl');
  });

  requestAnimationFrame((t) => { last = t; frame(t); });

  // ---- 設定 GUI（lil-gui）。読み込みに失敗しても炎の描画には影響させない ----
  const guiScript = document.createElement('script');
  guiScript.src = 'https://cdn.jsdelivr.net/npm/lil-gui@0.21.0/dist/lil-gui.umd.min.js';
  guiScript.onload = () => buildGui(window.lil.GUI);
  guiScript.onerror = () => console.warn('lil-gui could not be loaded; settings panel disabled.');
  document.head.append(guiScript);

  function buildGui(GUI) {
    const gui = new GUI({ title: 'Fire settings' });
    const stats = { fps: '' };

    const motionF = gui.addFolder('Motion');
    motionF.add(params, 'loop', 4, 30, 1).name('Loop (s)');
    motionF.add(params, 'speed', 0, 3, 0.05).name('Speed');
    motionF.add(params, 'rise', 1, 8, 1).name('Rise (per loop)');
    motionF.add(params, 'evol', 0, 6, 1).name('Churn (per loop)');
    motionF.add(params, 'freeze').name('Freeze');
    motionF.add(params, 'phase', 0, 1, 0.001).name('Phase').listen();

    const shapeF = gui.addFolder('Shape');
    shapeF.add(params, 'height', 0.15, 1.0, 0.01).name('Height');
    shapeF.add(params, 'tongue', 0, 1.5, 0.01).name('Tongue variance');
    shapeF.add(params, 'gaps', 0.5, 5, 0.05).name('Gaps / raggedness');
    shapeF.add(params, 'stretch', 1, 10, 0.1).name('Tongue density');
    shapeF.add(params, 'warp', 0, 2.5, 0.05).name('Warp');

    const lookF = gui.addFolder('Look');
    lookF.add(params, 'strands', 0, 2, 0.05).name('Filaments');
    lookF.add(params, 'sharp', 0.005, 0.3, 0.005).name('Edge softness');
    lookF.add(params, 'intensity', 0.5, 8, 0.1).name('Intensity');
    lookF.add(params, 'temp', 0.5, 2, 0.01).name('Temperature');
    lookF.add(params, 'back', 0, 3, 0.05).name('Back layer');
    lookF.add(params, 'haze', 0, 2, 0.05).name('Haze');
    lookF.add(params, 'vignette', 0, 1.5, 0.05).name('Vignette');

    const renderF = gui.addFolder('Render');
    renderF.add(params, 'quality', 0.25, 1, 0.05).name('Resolution').listen().onChange(resize);
    renderF.add(params, 'autoQuality').name('Auto resolution');
    renderF.add(stats, 'fps').name('FPS').disable().listen();
    setInterval(() => { stats.fps = `${fps.toFixed(0)}  (${canvas.width}×${canvas.height})`; }, 500);

    // 現在値を JSON でコピー（DEFAULTS に貼り戻せる形）。クリップボード不可ならコンソールへ
    const COPY_LABEL = 'Copy settings (JSON)';
    const copyCtrl = gui.add({
      copy: async () => {
        const { phase, freeze, ...rest } = params;
        const json = JSON.stringify(rest, null, 2);
        try {
          await navigator.clipboard.writeText(json);
          copyCtrl.name('Copied!');
        } catch {
          console.log(json);
          copyCtrl.name('Logged to console');
        }
        setTimeout(() => copyCtrl.name(COPY_LABEL), 1500);
      },
    }, 'copy').name(COPY_LABEL);
    gui.add({
      reset: () => {
        gui.reset();
        resize();
      },
    }, 'reset').name('Reset to defaults');

    // 狭い画面では閉じた状態で始める
    if (window.matchMedia('(max-width: 600px)').matches) gui.close();

    // H キーで GUI の表示を切り替える
    window.addEventListener('keydown', (e) => {
      if (e.key.toLowerCase() !== 'h' || e.target.closest?.('input, textarea')) return;
      gui.show(gui._hidden);   // lil-gui のドキュメントにあるトグルの書き方
    });
  }
})();
</script>
</body>
</html>
